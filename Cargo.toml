[package]
name = "egui-word-search"
version = "0.1.0"
edition = "2024"
description = "A Word Search game library for egui"
license = "MIT OR Apache-2.0"
authors = ["Yohan Boogaert <yozhgoor@outlook.com>"]
repository = "https://github.com/yozhgoor/egui-word-search"
homepage = "https://github.com/yozhgoor/egui-word-search"
documentation = "https://docs.rs/egui-word-search"
keywords = ["egui", "word-search", "game", "widget", "gui"]
categories = ["game-engines", "gui"]
exclude = ["/examples", "/.github"]

[lib]
name = "egui_word_search"

[dependencies]
egui = { version = "0.34", default-features = false }

[dev-dependencies]
xtask-wasm = { version = "0.6.5", features = ["run-example", "wasm-opt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "glow",
] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
